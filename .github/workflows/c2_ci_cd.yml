name: Component 2 STGNN CI

on:
  push:
    paths:
      - 'component_2_spatio/**'
  pull_request:
    paths:
      - 'component_2_spatio/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      working-directory: ./component_2_spatio
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create Mock .env File
      working-directory: ./component_2_spatio
      run: touch .env  # Satisfies the env_file requirement in docker-compose.yml
        
    - name: Verify Docker Compose Build
      working-directory: ./component_2_spatio
      run: docker compose build 