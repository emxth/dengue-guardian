<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1E3F9" />
      <stop offset="50%" stop-color="#578FCA" />
      <stop offset="100%" stop-color="#3674B5" />
    </linearGradient>

    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1F8EF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#A1E3F9" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circuit Background Traces -->
  <g stroke="#578FCA" stroke-width="2" opacity="0.6">
    <path d="M 60 180 L 100 180 L 120 200" fill="none" />
    <circle cx="60" cy="180" r="3" fill="#A1E3F9" />
    <path d="M 70 320 L 110 320 L 130 300" fill="none" />
    <circle cx="70" cy="320" r="3" fill="#A1E3F9" />
    <path d="M 440 180 L 400 180 L 380 200" fill="none" />
    <circle cx="440" cy="180" r="3" fill="#A1E3F9" />
    <path d="M 430 320 L 390 320 L 370 300" fill="none" />
    <circle cx="430" cy="320" r="3" fill="#A1E3F9" />
  </g>

  <!-- Outer Cybernetic Shield -->
  <path d="M 250 30 
           L 420 90 
           C 430 240, 390 380, 250 490 
           C 110 380, 70 240, 80 90 
           Z" 
        fill="url(#shieldInner)" 
        stroke="url(#shieldBorder)" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Inner Bevel Shield -->
  <path d="M 250 55 
           L 395 106 
           C 404 230, 370 355, 250 455 
           C 130 355, 96 230, 105 106 
           Z" 
        fill="none" 
        stroke="#578FCA" 
        stroke-width="3" 
        stroke-dasharray="12 6" 
        opacity="0.8" />

  <!-- Radar Rings (Eco Mint & Telemetry Sky) -->
  <circle cx="250" cy="245" r="140" stroke="#578FCA" stroke-width="2" opacity="0.4" fill="none" />
  <circle cx="250" cy="245" r="115" stroke="#A1E3F9" stroke-width="3" opacity="0.85" fill="none" filter="url(#glow)" />
  <circle cx="250" cy="245" r="75" stroke="#D1F8EF" stroke-width="2.5" opacity="0.9" fill="none" />
  <circle cx="250" cy="245" r="35" stroke="#A1E3F9" stroke-width="1.5" opacity="0.6" fill="none" />

  <!-- Radar Crosshairs Reticles -->
  <line x1="250" y1="95" x2="250" y2="395" stroke="#D1F8EF" stroke-width="2.5" opacity="0.85" />
  <line x1="100" y1="245" x2="400" y2="245" stroke="#D1F8EF" stroke-width="2.5" opacity="0.85" />
  
  <!-- Outer Crosshair Tick Marks -->
  <line x1="250" y1="85" x2="250" y2="105" stroke="#A1E3F9" stroke-width="4" />
  <line x1="250" y1="385" x2="250" y2="405" stroke="#A1E3F9" stroke-width="4" />
  <line x1="90" y1="245" x2="110" y2="245" stroke="#A1E3F9" stroke-width="4" />
  <line x1="390" y1="245" x2="410" y2="245" stroke="#A1E3F9" stroke-width="4" />

  <!-- Radar Sweep Sector -->
  <path d="M 250 245 L 335 140 A 115 115 0 0 0 250 130 Z" fill="url(#radarSweep)" />

  <!-- Mosquito Vector Silhouette (Target Centered) -->
  <g fill="#A1E3F9" filter="url(#glow)">
    <!-- Proboscis / Needle -->
    <path d="M 249 160 L 251 160 L 250.5 178 L 249.5 178 Z" fill="#D1F8EF" />
    
    <!-- Head -->
    <circle cx="250" cy="184" r="5.5" fill="#D1F8EF" />

    <!-- Antennae -->
    <path d="M 248 180 Q 235 168 232 172" stroke="#D1F8EF" stroke-width="1.8" fill="none" />
    <path d="M 252 180 Q 265 168 268 172" stroke="#D1F8EF" stroke-width="1.8" fill="none" />

    <!-- Thorax -->
    <ellipse cx="250" cy="204" rx="10.5" ry="15" fill="#FFFFFF" />

    <!-- Abdomen (Striped Aedes Pattern) -->
    <path d="M 243 222 
             C 243 250, 246 295, 250 315 
             C 254 295, 257 250, 257 222 
             Z" fill="#D1F8EF" />
    <!-- White Aedes Bands -->
    <ellipse cx="250" cy="235" rx="6" ry="1.8" fill="#0F172A" />
    <ellipse cx="250" cy="250" rx="5.2" ry="1.6" fill="#0F172A" />
    <ellipse cx="250" cy="265" rx="4.4" ry="1.4" fill="#0F172A" />
    <ellipse cx="250" cy="280" rx="3.5" ry="1.2" fill="#0F172A" />

    <!-- Wings (Translucent Oceanic Glow) -->
    <ellipse cx="205" cy="210" rx="42" ry="11" transform="rotate(-12 205 210)" fill="#A1E3F9" opacity="0.85" />
    <ellipse cx="295" cy="210" rx="42" ry="11" transform="rotate(12 295 210)" fill="#A1E3F9" opacity="0.85" />

    <!-- Legs (6 Jointed Arthropod Legs) -->
    <!-- Front Legs -->
    <path d="M 244 196 Q 215 178 190 192" stroke="#D1F8EF" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 256 196 Q 285 178 310 192" stroke="#D1F8EF" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Middle Legs -->
    <path d="M 243 205 Q 195 210 178 245" stroke="#D1F8EF" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 257 205 Q 305 210 322 245" stroke="#D1F8EF" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Hind Legs (Long Characteristic Arch) -->
    <path d="M 245 216 Q 190 260 195 320" stroke="#D1F8EF" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 255 216 Q 310 260 305 320" stroke="#D1F8EF" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Glowing Target Center -->
  <circle cx="250" cy="204" r="3.5" fill="#D1F8EF" filter="url(#glow)" />
</svg>
